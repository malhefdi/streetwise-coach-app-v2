name: CD Pipeline (Deploy to Production)

on:
  push:
    branches:
      - main # Only deploy from main branch

  # Allow manual deployment
  workflow_dispatch:

jobs:
  # Job 1: Run full CI first
  ci:
    name: Run CI Pipeline
    uses: ./.github/workflows/ci.yml

  # Job 2: Deploy to Vercel
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci # Only deploy if CI passes
    environment:
      name: production
      url: https://streetwise-coach.vercel.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Get deployment URL
        id: deployment
        run: echo "url=$(vercel inspect --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT

  # Job 3: Run database migrations
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: deploy
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Supabase CLI
        run: |
          npm install -g supabase

      - name: Run Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push

  # Job 4: Smoke tests
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy, migrate]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment to be ready
        run: sleep 30

      - name: Check if site is accessible
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://streetwise-coach.vercel.app)
          if [ $response -ne 200 ]; then
            echo "Site returned status code: $response"
            exit 1
          fi

      - name: Check authentication endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://streetwise-coach.vercel.app/auth/login)
          if [ $response -ne 200 ]; then
            echo "Auth endpoint returned status code: $response"
            exit 1
          fi

  # Job 5: Notify on success/failure
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy, migrate, smoke-test]
    if: always()

    steps:
      - name: Send Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
